# Case eval (#73): example business models (fictional companies, docs/examples) with the entities the case
# analysis should count as matches. Run with `navigator case-eval`; the report goes to eval/case_report.md.
#
# pdf: relative to this file.
# needs: pinned from an Apertus read on 2026-10-18, so matching changes are measured on the same input.
#   Remove them to have Apertus read the PDF again (the report then shows the new needs).
# must_match: entities whose shown claims serve a need. Includes some the data cannot match today (a person
#   with no unit link, a project with only its name): they show up as "missed" and measure coverage.
# must_not_match: loose matches seen in the first run (generic claims like "clinical studies", or a lab from
#   another field). Not exhaustive: read the "Matched entity" table of the report for new ones.
# score: plausible range of the overall score. The low-fit case (vinora) checks the score does not flatter.
# Matching rules as in eval/gold.yaml: people match when every word of the name is in the result name.
#
# Picked by an agent from the shared DB's claims (2026-10-18), not from search results.
# NOT yet reviewed by a human (like eval/gold.yaml, #60).

cases:
  - id: glucora
    pdf: ../docs/examples/glucora-business-model.pdf
    score: [55, 90]
    needs:
      - clinical validation of sensor accuracy
      - continuous glucose monitoring research
      - artificial pancreas systems
      - AI for meal carbohydrate estimation
      - wearable biosensor interface development
    must_match:
      - {name: "Diabetes Center Berne", type: unit}
      - {name: "DCB Research AG", type: unit}
      - {name: "AI in Health and Nutrition", type: unit}
      - {name: "Lilian Witthauer", type: person}
      - {name: "Stavroula Mougiakakou", type: person}
      - {name: "Intelligent Nutrition", type: project}
      - {name: "enhance-d", type: project}
      - {name: "SPN-005 – Pilot study on painless glucose monitoring", type: project}  # one entity since #127
      - {name: "GoCARB", type: project}
      - {name: "goFOOD", type: project}
      - {name: "Adaptive Diabetes Management", type: project}
    must_not_match:
