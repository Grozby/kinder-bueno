# Gold set (plan 10.1). 3 use cases x 3 phrasings: (a) the site's own wording, (b) a lay term, (c) a synonym.
# Expected entities come from crawled pages only and are confirmed by a human (plan 10.1 rules).
# Candidates suggested by an agent (SQL over shown claims by topic, not from search results);
# confirmed by the project owner on 2026-10-18, unchanged.
# Matching: people match when every word of `name` is in the result name (titles ignored);
# units match on the normalised name. `url` is the page that shows the entity, for checking by hand.
use_cases:
  - id: glucose
    queries:
      - "continuous glucose monitoring"
      - "glucose sensors"
      - "biosensing for diabetes"
    expected:
      - {name: "Diabetes Center Berne", type: unit, url: "https://www.dcberne.com/en/"}
