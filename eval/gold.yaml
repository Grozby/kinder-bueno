# Gold set v2 (plan 10.1), for the 340-page crawl (#75). 6 use cases x 3 phrasings: (a) the site's own wording,
# (b) a lay term, (c) a synonym. v1 (100 pages, 3 use cases) is kept in gold_v1.yaml.
# Expected entities come from crawled pages only and are confirmed by a human (plan 10.1 rules).
# Candidates suggested by an agent from shown topic claims (bge-m3 cosine to the phrasings, plus keywords; not from
# search results), each checked against its quote and page. Claims whose quote does not name the topic (example
# topics copied onto team pages, department lists repeated on every lab page) were not used.
# Confirmed by the project owner on 2026-10-19. Changes from v1: Stefan Weber removed (named only as head of a
# former group, on the research overview page); Raphael Sznitman (AIMI) and Bally Lab added; rehab, immuno and
# microbiome added.
# Matching: people match when every word of `name` is in the result name (titles ignored);
# units match on the normalised name. `url` is the page that shows the entity, for checking by hand.
use_cases:
  - id: glucose
    queries:
      - "continuous glucose monitoring"
      - "glucose sensors"
      - "biosensing for diabetes"
    expected:
      - {name: "Diabetes Center Berne", type: unit, url: "https://www.dcberne.com/en/"}
      - {name: "Lilian Witthauer", type: person, url: "https://www.dcberne.com/en/team/"}
      - {name: "Thomas Züger", type: person, url: "https://www.dcberne.com/en/project/hypoxanthine-project/"}
      - {name: "Christoph Stettler", type: person, url: "https://www.dcberne.com/en/team/"}
      - {name: "Stavroula Mougiakakou", type: person, url: "https://www.artorg.unibe.ch/research/aihn/index_eng.html"}
