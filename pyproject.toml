[project]
name = "kinder-bueno"
version = "0.1.0"
description = "Research & Expertise Navigator for the Bern research ecosystem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28.1",
    "pgvector>=0.5.1",
    "openai>=3.35.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "selectolax>=1.0.1",
    "sentence-transformers>=6.1.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "unidecode>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
navigator = "navigator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
