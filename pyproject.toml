[project]
name = "kinder-bueno"
version = "0.1.0"
description = "Research & Expertise Navigator for the Bern research ecosystem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
navigator = "navigator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
