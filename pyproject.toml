[project]
name = "kinder-bueno"
version = "0.1.0"
description = "Research & Expertise Navigator for the Bern research ecosystem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.144.0",
    "httpx[http2]>=0.28.1",
    "pgvector>=0.5.1",
    "openai>=3.35.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "selectolax>=1.0.1",
    "sentence-transformers>=6.1.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "unidecode>=1.4.0",
    "uvicorn==0.54.0",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
navigator = "navigator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Linux (Docker) gets the CPU-only torch wheel: the default one pulls ~4 GB of CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
