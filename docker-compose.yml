# Run everything:   docker compose up -d db && docker compose run --rm app uv run navigator ingest
#                   docker compose up app frontend   →  UI http://localhost:5173, API http://localhost:8000/docs
# Demo from a snapshot instead of ingest: docker compose run --rm restore (loads checkpoints/demo.dump; README "Demo")
# Host ports can be changed (DB_PORT, API_PORT, UI_PORT), e.g. to run a second stack next to the first.
# Packaged for someone else to run (built UI on nginx, only the UI published): docs/HANDOFF.md, docker-compose.handoff.yml.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: navigator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-navigator}
      POSTGRES_DB: navigator
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigator"]
      interval: 5s
      retries: 10

  app:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://navigator:${POSTGRES_PASSWORD:-navigator}@db:5432/navigator
      HF_HOME: /cache/hf
    depends_on:
      db: { condition: service_healthy }
    ports: ["${API_PORT:-8000}:8000"]
    volumes:
      - hf_cache:/cache/hf          # keeps the bge-m3 download (~2.3 GB) between runs
      - ./backend/config:/app/config
      - ./backend/eval:/app/eval
    command: uv run navigator serve --host 0.0.0.0 --port 8000
    healthcheck:                    # the API is ready once the embedding model is loaded; sends API_TOKEN if set
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://localhost:8000/api/stats', headers={'Authorization': 'Bearer ' + os.environ.get('API_TOKEN', '')}))"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  frontend:
    image: node:24-slim
    working_dir: /frontend
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://app:8000}  # read by vite.config.ts; a teammate's backend with --no-deps
      BACKEND_TOKEN: ${BACKEND_TOKEN:-${API_TOKEN:-}}  # default: the app's API_TOKEN from .env; the proxy adds it, the browser never sees it
      VITE_USE_MOCK: ${VITE_USE_MOCK:-false}  # real backend; true for UI work on routes the backend does not serve yet
      VITE_SHOW_UNFINISHED: ${VITE_SHOW_UNFINISHED:-false}  # true shows controls whose backend is not there yet (none since #97)
    depends_on:
      app: { condition: service_healthy }
    ports: ["${UI_PORT:-5173}:5173"]
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules  # container's own node_modules, not the host's
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

  restore:                          # docker compose run --rm restore: replaces the database with a pg_dump snapshot
    image: pgvector/pgvector:pg16
    profiles: [demo]                # only started on request, never by `up`
    depends_on:
      db: { condition: service_healthy }
    volumes: [./checkpoints:/checkpoints:ro]
    command: >-
      pg_restore --clean --if-exists --no-owner --exit-on-error
      -d postgresql://navigator:${POSTGRES_PASSWORD:-navigator}@db:5432/navigator /checkpoints/${DEMO_SNAPSHOT:-demo.dump}

volumes:
  pgdata:
  hf_cache:
  frontend_node_modules:
