defaults:
  user_agent: "HackApertus-ExpertiseNavigator/0.1 (research prototype; contact: team)"
  delay_seconds: 1.0          # per host
  timeout_seconds: 20
  max_depth: 3

# Priority patterns decide what the page budget is spent on: they must be narrow.
# A broad pattern (like '/research/') matches everything and the crawl spends
# the whole budget on the first labs it finds.

sources:
  - id: artorg
    name: "ARTORG Center for Biomedical Engineering Research"
    seeds:
      - https://www.artorg.unibe.ch/research/index_eng.html
      - https://www.artorg.unibe.ch/services/index_eng.html
    allow_hosts: ["www.artorg.unibe.ch"]
    include_patterns: ['index_eng\.html$']
    exclude_patterns: ['/news_and_events/', '/studies/', '/jobs/', '/job_vacancies/', '/open_positions/', '/publications/', '/teaching/', '/msc_thesis_projects/', '/about_us/']
    priority_patterns:
      - '^https://www\.artorg\.unibe\.ch/research/[a-z0-9_]+/index_eng\.html$'                # lab overview
      - '^https://www\.artorg\.unibe\.ch/research/[a-z0-9_]+/group_members/index_eng\.html$'  # names, roles, emails
      - '^https://www\.artorg\.unibe\.ch/services/[a-z0-9_]+/index_eng\.html$'                # infrastructure
      # Senior people's profiles (#75): their CV text names their research topics, the member list does not.
      # 52 of 144 profiles (2026-10-18); the others are crawled with what is left of the budget.
      - '^https://www\.artorg\.unibe\.ch/research/[a-z0-9_]+/group_members/(persons/)?(prof|dr|pd)_[a-z0-9_]+/index_eng\.html$'
    max_pages: 110

  - id: dcb
    name: "Diabetes Center Berne"
    seeds:
      - https://www.dcberne.com/en/team/
      - https://www.dcberne.com/en/projects/
      - https://www.dcberne.com/en/focus-areas/
      - https://www.dcberne.com/en/offering/
    allow_hosts: ["www.dcberne.com"]
    include_patterns: ['^https://www\.dcberne\.com/en/']
    exclude_patterns: ['/wp-json/', '/wp-content/', '/feed/', '/category/', '/page/[0-9]+/', '/newsletters/', '/career/', '/data-protection-statement/', '/legal-notice/', '/community/', '/media/', '/get-involved/', '/dcb-foundation/', '/vision-mission/', '/contact/', '/news/', '\?']
    priority_patterns: ['/en/project/', '/en/project_category/', '/innovation/$', '/partners-network/$']
    max_pages: 30

  - id: unibe
    name: "University of Bern"
    # Fallback seeds (no subdomain inventory): biomedical research labs and clusters.
    seeds:
      - https://www.dbmr.unibe.ch/research/research_programs/index_eng.html
      - https://www.cvrc.unibe.ch/index_eng.html
      - https://www.sitem.unibe.ch/index_eng.html
    allow_hosts: ["www.dbmr.unibe.ch", "www.cvrc.unibe.ch", "www.sitem.unibe.ch"]
    include_patterns: ['index_eng\.html$']
    exclude_patterns: ['/news', '/media_release', '/studies/', '/jobs/', '/legal_notice/', '/imprint/', '/publications/', '/boris_portal', '_award', '_prize', '/events/', '/seminars', '/conferences']
    priority_patterns:
      - '/research_programs/[a-z0-9_]+/index_eng\.html$'        # lab overview
      - '/research_programs/[a-z0-9_]+/team/index_eng\.html$'   # names, roles
      - '^https://www\.(cvrc|sitem)\.unibe\.ch/[a-z0-9_]+/index_eng\.html$'
    # #75: 200 pages reach ~100 lab overviews and ~100 team pages (25 reached 19 labs). The DBMR person
    # profiles are contact cards without research text, and 4 links deep, so they are not crawled.
    max_pages: 200
